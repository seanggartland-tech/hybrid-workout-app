<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGE 5 | Hybrid Strength &amp; Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fira+Sans:wght@400;600;700;800&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f6f6;
    --panel:#ffffff;
    --panel-2:#efe9e6;
    --border:#000000;
    --text:#000000;
    --text-dim:#8a8a8e;
    --accent:#f08227;
    --done:#f08227;
    --danger:#b3261e;
    --ink:#000000;
    --cream:#f9f6f6;
    --radius:8px;
    --font-head:'Bangers', 'Arial Black', 'Impact', sans-serif;
    --font-sub:'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body:'Source Code Pro', 'SFMono-Regular', Consolas, 'Courier New', monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  button{ font:inherit; color:inherit; }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header.topbar{
    position:relative; position:sticky; top:0; z-index:10;
    padding: calc(14px + var(--safe-top)) 16px 18px;
    background:#000000;
    border-bottom:none;
    display:flex; align-items:center; gap:10px;
  }
  header.topbar::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:4px;
    background:repeating-linear-gradient(135deg, var(--accent) 0 8px, #000000 8px 16px);
  }
  .back-btn, .refresh-btn{
    appearance:none; border:1px solid #333; background:#1a1a1a; color:var(--cream);
    width:40px; height:40px; border-radius:6px; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .back-btn:active, .refresh-btn:active{ background:var(--accent); border-color:var(--accent); color:#000; }
  .topbar-titles{ min-width:0; flex:1; }
  .topbar-titles .eyebrow{ font-family:var(--font-sub); font-size:11px; color:var(--accent); text-transform:uppercase; font-weight:700; letter-spacing:0.1em; margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-titles h1{ font-family:var(--font-head); font-size:22px; letter-spacing:.03em; color:var(--cream); margin:0; font-weight:400; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  main{ flex:1; padding: 16px 16px calc(28px + var(--safe-bottom)); }

  .app-title{ text-align:center; padding: 30px 16px 10px; }
  .app-title .app-format{ font-family:var(--font-sub); font-size:11.5px; font-weight:700; letter-spacing:.12em; color:var(--text-dim); text-transform:uppercase; margin:0 0 4px; }
  .app-title h1{ font-family:var(--font-head); font-size:34px; letter-spacing:.02em; text-transform:uppercase; margin:0 0 6px; color:var(--text); }
  .app-title .app-tagline{ font-family:var(--font-sub); font-weight:700; color:var(--accent); margin:0 0 10px; font-size:15px; letter-spacing:.02em; }
  .app-title p{ color:var(--text-dim); margin:0; font-size:13px; }

  .card-grid{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .pick-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel); border:2px solid var(--border); border-radius:var(--radius);
    padding:20px; text-align:left;
    border-left: 6px solid var(--pick-color, var(--accent));
  }
  .pick-card .pc-name{ font-family:var(--font-sub); font-size:17px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; color:var(--text); }
  .pick-card .pc-count{ font-family:var(--font-body); font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .pick-card .pc-arrow{ color:var(--accent); font-size:22px; font-weight:700; }

  .workout-list{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .workout-card{
    background:var(--panel); border:2px solid var(--border); border-radius:var(--radius);
    padding:16px; text-align:left;
    border-left: 5px solid var(--pick-color, var(--accent));
    display:flex; flex-direction:column; gap:4px;
  }
  .workout-card .wc-label{ font-family:var(--font-sub); font-size:16px; font-weight:700; line-height:1.35; color:var(--text); }
  .workout-card .wc-meta{ font-family:var(--font-body); font-size:12px; color:var(--text-dim); }

  .progress-wrap{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .progress-bar{ flex:1; height:10px; border-radius:4px; background:var(--panel-2); overflow:hidden; border:2px solid var(--border); }
  .progress-bar-fill{ height:100%; background:var(--done); width:0%; transition:width .25s ease; }
  .progress-text{ font-family:var(--font-sub); font-weight:700; font-size:12.5px; color:var(--text-dim); white-space:nowrap; }

  .block{ background:var(--panel); border:2px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .block-header{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px; border-bottom:2px solid var(--panel-2); padding-bottom:8px; }
  .block-title{ font-family:var(--font-head); font-size:19px; letter-spacing:.03em; text-transform:uppercase; font-weight:400; }
  .block-scheme{ font-family:var(--font-body); font-size:12px; color:var(--text-dim); text-align:right; }
  .block-simple-value{ font-family:var(--font-body); font-size:15px; color:var(--text); margin-top:8px; }

  .ex-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-top:1px solid var(--panel-2); }
  .ex-row:first-of-type{ border-top:none; margin-top:10px; }
  .checkbox{ flex:0 0 auto; width:26px; height:26px; border-radius:6px; border:2px solid var(--border); background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:15px; color:transparent; }
  .checkbox.checked{ background:var(--done); border-color:var(--done); color:#000000; }
  .ex-name{ flex:1; font-family:var(--font-body); font-size:14.5px; line-height:1.3; }
  .ex-row.checked .ex-name{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-dim); }
  .ex-reps{ flex:0 0 auto; font-family:var(--font-sub); font-weight:700; font-size:12.5px; color:var(--text); background:var(--panel-2); border:1px solid var(--border); padding:4px 9px; border-radius:20px; }

  .state-wrap{ text-align:center; padding:60px 20px; color:var(--text-dim); }
  .state-wrap .spinner{
    width:34px; height:34px; margin:0 auto 18px; border-radius:50%;
    border:3px solid var(--panel-2); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .state-wrap h2{ font-family:var(--font-head); text-transform:uppercase; letter-spacing:.02em; color:var(--text); font-size:20px; margin:0 0 8px; }
  .state-wrap p{ font-family:var(--font-body); font-size:14px; line-height:1.5; margin:0 0 18px; }
  .retry-btn{
    appearance:none; border:2px solid var(--border); background:var(--accent); color:#000000;
    padding:10px 22px; border-radius:6px; font-family:var(--font-sub); font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  }
  .retry-btn:active{ background:var(--text); color:var(--cream); }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <button class="back-btn hidden" id="backBtn" aria-label="Back">&larr;</button>
    <div class="topbar-titles">
      <p class="eyebrow hidden" id="topEyebrow"></p>
      <h1 id="topTitle">🏋️ FORGE 5</h1>
    </div>
    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh" title="Refresh from Google Sheet">&#8635;</button>
  </header>

  <main id="main"></main>

</div>

<script>
// ---- Configure your two Google Sheet IDs here ----
const WORKOUTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJHvKXj6Pes58BUy7OxfmQZXPfVfIza2nMh6aNRx7UbeTXXpEk6ExJXYxhBalN33GAGDu30nOQsl5p/pub?gid=659725836&single=true&output=csv";
const EXERCISES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPp1r2RqFEYw_-NOLgj3WXLPGPPyKdrQzi7vqG9vy-_SACgTACSukKjiHXsBVpkvstLm-1eypu0PRw/pub?gid=1385248182&single=true&output=csv";

const csvUrl = baseUrl => `${baseUrl}&_=${Date.now()}`;

const PALETTE = ['#4f8cff','#39c0a8','#e8916b','#c17ee8','#e0c341','#5fd0e0','#e06b91','#8ec97a'];
function colorFor(str){
  let hash = 0;
  for (let i = 0; i < str.length; i++){ hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
  return PALETTE[hash % PALETTE.length];
}

// ---------- CSV parsing (RFC4180-ish: quoted fields, embedded commas/quotes/newlines) ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore, \n handles the break */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

function rowsToObjects(rows){
  if (!rows.length) return [];
  const headers = rows[0].map(h => (h || '').trim());
  return rows.slice(1)
    .filter(r => r.some(v => v && v.trim() !== ''))
    .map(r => {
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (r[idx] ?? '').trim(); });
      return obj;
    });
}

async function fetchCSV(baseUrl, label){
  let resp;
  try {
    resp = await fetch(csvUrl(baseUrl), { cache: 'no-store' });
  } catch (e) {
    throw new Error(`network`);
  }
  if (!resp.ok){
    throw new Error(resp.status === 401 || resp.status === 403 ? 'forbidden' : 'http-' + resp.status);
  }
  const text = await resp.text();
  if (text.trim().startsWith('<')){
    // Google returns an HTML sign-in/error page instead of CSV when the sheet isn't link-shared
    throw new Error('forbidden');
  }
  return text;
}

function buildData(workoutRows, exerciseRows){
  const workouts = [];
  const byId = {};
  workoutRows.forEach((r, idx) => {
    const id = r['Workout ID'] || '';
    if (!id && !r['Program'] && !r['Focus'] && !r['Workout Label']) return;
    const w = {
      id,
      program: r['Program'] || '',
      focus: r['Focus'] || '',
      label: r['Workout Label'] || '',
      warmup: r['Warm-up'] || '',
      closerScheme: r['Closer / Conditioning Scheme'] || '',
      closerModality: r['Closer / Conditioning Modality'] || '',
      sections: [],
      _sectionMap: new Map(),
      orderIndex: idx,
    };
    workouts.push(w);
    if (id) byId[id] = w;
  });

  exerciseRows.forEach(r => {
    const wid = r['Workout ID'] || '';
    const exercise = r['Exercise'] || '';
    if (!wid || !exercise) return;
    const w = byId[wid];
    if (!w) return;
    const secName = r['Section'] || 'Circuit';
    let sec = w._sectionMap.get(secName);
    if (!sec){
      sec = { name: secName, scheme: r['Section Scheme'] || '', exercises: [] };
      w._sectionMap.set(secName, sec);
      w.sections.push(sec);
    }
    const orderVal = parseFloat(r['Order']);
    sec.exercises.push({
      order: Number.isFinite(orderVal) ? orderVal : sec.exercises.length + 1,
      exercise,
      reps: r['Reps'] || '',
    });
  });

  workouts.forEach(w => {
    w.sections.forEach(sec => sec.exercises.sort((a, b) => a.order - b.order));
    delete w._sectionMap;
  });

  const programs = [];
  const seen = new Set();
  workouts.forEach(w => {
    if (w.program && !seen.has(w.program)){ seen.add(w.program); programs.push(w.program); }
  });

  return { programs, workouts };
}

// ---------------- App state / navigation ----------------
let DATA = { programs: [], workouts: [] };
let view = 'loading'; // loading | error | program | focus | list | detail
let errorKind = null;
let currentProgram = null;
let currentFocus = null;
let currentWorkoutId = null;
const checkedState = {}; // workoutId -> Set of "sectionIdx-exIdx" (in-memory only, resets on reload)

const main = document.getElementById('main');
const backBtn = document.getElementById('backBtn');
const refreshBtn = document.getElementById('refreshBtn');
const topTitle = document.getElementById('topTitle');
const topEyebrow = document.getElementById('topEyebrow');

backBtn.addEventListener('click', () => {
  if (view === 'detail') goTo('list');
  else if (view === 'list') goTo('focus');
  else if (view === 'focus') goTo('program');
});
refreshBtn.addEventListener('click', () => loadAndRender(true));

function setHeader({ back = false, eyebrow = '', title = '🏋️ FORGE 5' } = {}){
  backBtn.classList.toggle('hidden', !back);
  if (eyebrow){ topEyebrow.textContent = eyebrow; topEyebrow.classList.remove('hidden'); }
  else { topEyebrow.classList.add('hidden'); }
  topTitle.textContent = title;
}

function goTo(next){
  view = next;
  if (next === 'program'){ currentProgram = null; currentFocus = null; currentWorkoutId = null; setHeader(); }
  else if (next === 'focus'){ currentFocus = null; currentWorkoutId = null; setHeader({ back: true, title: currentProgram }); }
  else if (next === 'list'){ currentWorkoutId = null; setHeader({ back: true, eyebrow: currentProgram, title: currentFocus }); }
  render();
}

function render(){
  if (view === 'loading') return renderLoading();
  if (view === 'error') return renderError();
  if (view === 'program') return renderProgram();
  if (view === 'focus') return renderFocus();
  if (view === 'list') return renderList();
  if (view === 'detail') return renderDetail();
}

function renderLoading(){
  setHeader();
  main.innerHTML = `
    <div class="state-wrap">
      <div class="spinner"></div>
      <h2>Loading your workouts&hellip;</h2>
      <p>Pulling the latest data from your Google Sheet.</p>
    </div>`;
}

function renderError(){
  setHeader();
  const messages = {
    forbidden: "This app couldn't read your Google Sheet. Make sure both the Workouts and Exercises sheets are still published (File → Share → Publish to web) as CSV.",
    network: "Couldn't reach Google Sheets — check your internet connection and try again.",
  };
  const msg = messages[errorKind] || "Something went wrong loading your workouts. Please try again.";
  main.innerHTML = `
    <div class="state-wrap">
      <h2>Couldn't load workouts</h2>
      <p>${escapeHtml(msg)}</p>
      <button class="retry-btn" id="retryBtn">Try again</button>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', () => loadAndRender(true));
}

function renderEmpty(title, hint){
  main.innerHTML = `
    <div class="state-wrap">
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(hint)}</p>
    </div>`;
}

function renderProgram(){
  setHeader();
  if (!DATA.programs.length){
    return renderEmpty('No programs yet', 'Add a row to your Workouts Google Sheet (with a Program name) and tap refresh.');
  }
  const counts = {};
  DATA.workouts.forEach(w => { if (w.program) counts[w.program] = (counts[w.program] || 0) + 1; });

  let html = `
    <div class="app-title">
      <p class="app-format">Hybrid Strength &amp; Performance &middot; The 5-Day Hybrid Training System</p>
      <h1>Choose Your Program</h1>
      <p class="app-tagline">Five Days. One Stronger You.</p>
      <p>${DATA.workouts.length} workout${DATA.workouts.length === 1 ? '' : 's'} loaded</p>
    </div>
    <div class="card-grid">`;
  DATA.programs.forEach(p => {
    html += `
      <button class="pick-card" style="--pick-color:${colorFor(p)}" data-value="${escapeAttr(p)}">
        <div>
          <div class="pc-name">${escapeHtml(p)}</div>
          <div class="pc-count">${counts[p] || 0} workout${(counts[p]||0) === 1 ? '' : 's'}</div>
        </div>
        <div class="pc-arrow">&rsaquo;</div>
      </button>`;
  });
  html += `</div>`;
  main.innerHTML = html;
  main.querySelectorAll('.pick-card').forEach(btn => {
    btn.addEventListener('click', () => { currentProgram = btn.dataset.value; goTo('focus'); });
  });
}

function renderFocus(){
  setHeader({ back: true, title: currentProgram });
  const inProgram = DATA.workouts.filter(w => w.program === currentProgram);
  const focuses = [];
  const seen = new Set();
  inProgram.forEach(w => { if (w.focus && !seen.has(w.focus)){ seen.add(w.focus); focuses.push(w.focus); } });

  if (!focuses.length){
    return renderEmpty('No focuses yet', 'Add a Focus value to this program’s workouts on your Google Sheet.');
  }
  const counts = {};
  inProgram.forEach(w => { if (w.focus) counts[w.focus] = (counts[w.focus] || 0) + 1; });

  let html = `<div class="card-grid" style="margin-top:6px;">`;
  focuses.forEach(f => {
    html += `
      <button class="pick-card" style="--pick-color:${colorFor(f)}" data-value="${escapeAttr(f)}">
        <div>
          <div class="pc-name">${escapeHtml(f)}</div>
          <div class="pc-count">${counts[f] || 0} workout${(counts[f]||0) === 1 ? '' : 's'}</div>
        </div>
        <div class="pc-arrow">&rsaquo;</div>
      </button>`;
  });
  html += `</div>`;
  main.innerHTML = html;
  main.querySelectorAll('.pick-card').forEach(btn => {
    btn.addEventListener('click', () => { currentFocus = btn.dataset.value; goTo('list'); });
  });
}

function renderList(){
  setHeader({ back: true, eyebrow: currentProgram, title: currentFocus });
  const list = DATA.workouts.filter(w => w.program === currentProgram && w.focus === currentFocus);
  if (!list.length){
    return renderEmpty('No workouts yet', 'Add a workout row with this Program and Focus on your Google Sheet.');
  }
  let html = `<div class="workout-list">`;
  list.forEach(w => {
    const secCount = w.sections.length;
    const exCount = w.sections.reduce((n, s) => n + s.exercises.length, 0);
    html += `
      <button class="workout-card" style="--pick-color:${colorFor(w.focus)}" data-id="${escapeAttr(w.id)}">
        <div class="wc-label">${escapeHtml(w.label || '(untitled workout)')}</div>
        <div class="wc-meta">${secCount} section${secCount===1?'':'s'} · ${exCount} exercise${exCount===1?'':'s'} · Warm-up: ${escapeHtml(w.warmup || '—')}</div>
      </button>`;
  });
  html += `</div>`;
  main.innerHTML = html;
  main.querySelectorAll('.workout-card').forEach(btn => {
    btn.addEventListener('click', () => {
      currentWorkoutId = btn.dataset.id;
      view = 'detail';
      const w = DATA.workouts.find(x => x.id === currentWorkoutId);
      setHeader({ back: true, eyebrow: currentFocus, title: w ? w.label : '' });
      render();
    });
  });
}

function totalCheckable(workout){ return workout.sections.reduce((n, s) => n + s.exercises.length, 0); }
function checkedCount(workout){ const set = checkedState[workout.id]; return set ? set.size : 0; }

function renderDetail(){
  const workout = DATA.workouts.find(w => w.id === currentWorkoutId);
  if (!workout){ return goTo('list'); }
  if (!checkedState[workout.id]) checkedState[workout.id] = new Set();

  const total = totalCheckable(workout);
  const done = checkedCount(workout);
  const pct = total ? Math.round((done / total) * 100) : 0;

  let html = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${done}/${total} done</div>
    </div>`;

  if (workout.warmup){
    html += `
      <div class="block">
        <div class="block-header"><div class="block-title">🔥 Warm-up</div></div>
        <div class="block-simple-value">${escapeHtml(workout.warmup)}</div>
      </div>`;
  }

  workout.sections.forEach((sec, sIdx) => {
    html += `
      <div class="block">
        <div class="block-header">
          <div class="block-title">${escapeHtml(sec.name)}</div>
          <div class="block-scheme">${escapeHtml(sec.scheme || '')}</div>
        </div>`;
    sec.exercises.forEach((ex, eIdx) => {
      const key = sIdx + '-' + eIdx;
      const isChecked = checkedState[workout.id].has(key);
      html += `
        <div class="ex-row ${isChecked?'checked':''}" data-key="${key}">
          <div class="checkbox ${isChecked?'checked':''}">&#10003;</div>
          <div class="ex-name">${escapeHtml(ex.exercise)}</div>
          ${ex.reps ? `<div class="ex-reps">${escapeHtml(ex.reps)}</div>` : ''}
        </div>`;
    });
    html += `</div>`;
  });

  if (workout.closerScheme || workout.closerModality){
    html += `
      <div class="block">
        <div class="block-header"><div class="block-title">⚡ Closer / Conditioning</div></div>
        <div class="block-simple-value">${escapeHtml(workout.closerScheme || '')}${workout.closerScheme && workout.closerModality ? ' — ' : ''}${escapeHtml(workout.closerModality || '')}</div>
      </div>`;
  }

  if (!workout.sections.length && !workout.closerScheme && !workout.warmup){
    html += `<div class="state-wrap" style="padding:30px 10px;"><p>No details added for this workout yet.</p></div>`;
  }

  main.innerHTML = html;
  main.querySelectorAll('.ex-row').forEach(row => {
    row.addEventListener('click', () => {
      const key = row.dataset.key;
      const set = checkedState[workout.id];
      if (set.has(key)) set.delete(key); else set.add(key);
      renderDetail();
    });
  });
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function loadAndRender(isRetry){
  view = 'loading';
  render();
  try {
    const [wText, eText] = await Promise.all([
      fetchCSV(WORKOUTS_CSV_URL, 'workouts'),
      fetchCSV(EXERCISES_CSV_URL, 'exercises'),
    ]);
    const workoutRows = rowsToObjects(parseCSV(wText));
    const exerciseRows = rowsToObjects(parseCSV(eText));
    DATA = buildData(workoutRows, exerciseRows);
    goTo('program');
  } catch (e) {
    errorKind = e && e.message ? e.message : 'unknown';
    view = 'error';
    render();
  }
}

loadAndRender(false);
</script>
