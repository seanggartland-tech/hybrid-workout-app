<title>Hybrid Performance</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --border:#2a2f3a;
    --text:#eef0f4;
    --text-dim:#9aa2b1;
    --accent:#4f8cff;
    --push:#4f8cff;
    --legs:#39c0a8;
    --pull:#e8916b;
    --athletic:#c17ee8;
    --default-focus:#8b93a7;
    --done:#39c0a8;
    --radius:16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  button{ font:inherit; color:inherit; }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header.topbar{
    position:sticky; top:0; z-index:10;
    padding: calc(14px + var(--safe-top)) 16px 14px;
    background:rgba(15,17,21,0.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .back-btn{
    appearance:none; border:none; background:var(--panel-2); color:var(--text);
    width:40px; height:40px; border-radius:12px; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .back-btn:active{ background:var(--border); }
  .topbar-titles{ min-width:0; flex:1; }
  .topbar-titles .eyebrow{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 2px; }
  .topbar-titles h1{ font-size:18px; margin:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  main{ flex:1; padding: 16px 16px calc(28px + var(--safe-bottom)); }

  /* ---------- Focus picker ---------- */
  .app-title{ text-align:center; padding: 28px 16px 8px; }
  .app-title h1{ font-size:26px; margin:0 0 6px; }
  .app-title p{ color:var(--text-dim); margin:0; font-size:14px; }

  .focus-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-top:18px; }
  .focus-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; text-align:left;
    border-left: 5px solid var(--focus-color, var(--accent));
  }
  .focus-card .fc-name{ font-size:17px; font-weight:700; color:var(--text); }
  .focus-card .fc-count{ font-size:13px; color:var(--text-dim); margin-top:2px; }
  .focus-card .fc-arrow{ color:var(--text-dim); font-size:20px; }

  /* ---------- Workout list ---------- */
  .workout-list{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .workout-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; text-align:left;
    border-left: 4px solid var(--focus-color, var(--accent));
    display:flex; flex-direction:column; gap:4px;
  }
  .workout-card .wc-label{ font-size:16px; font-weight:600; line-height:1.35; color:var(--text); }
  .workout-card .wc-meta{ font-size:12.5px; color:var(--text-dim); }

  /* ---------- Detail view ---------- */
  .progress-wrap{
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .progress-bar{
    flex:1; height:8px; border-radius:6px; background:var(--panel-2); overflow:hidden; border:1px solid var(--border);
  }
  .progress-bar-fill{ height:100%; background:var(--done); width:0%; transition:width .25s ease; }
  .progress-text{ font-size:12.5px; color:var(--text-dim); white-space:nowrap; }

  .block{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .block-header{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px; }
  .block-title{ font-size:15px; font-weight:700; letter-spacing:.01em; }
  .block-scheme{ font-size:12.5px; color:var(--text-dim); text-align:right; }
  .block-simple-value{ font-size:15px; color:var(--text); margin-top:8px; }

  .ex-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 4px; border-top:1px solid var(--border);
  }
  .ex-row:first-of-type{ border-top:none; margin-top:10px; }
  .checkbox{
    flex:0 0 auto; width:26px; height:26px; border-radius:8px;
    border:2px solid var(--border); background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; color:transparent;
  }
  .checkbox.checked{ background:var(--done); border-color:var(--done); color:#0b1210; }
  .ex-name{ flex:1; font-size:15px; line-height:1.3; }
  .ex-row.checked .ex-name{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border); }
  .ex-reps{ flex:0 0 auto; font-size:13px; color:var(--text-dim); background:var(--panel-2); border:1px solid var(--border); padding:4px 9px; border-radius:20px; }

  .warmup-icon, .closer-icon{ font-size:13px; }

  .hidden{ display:none !important; }

  footer.hint{ text-align:center; color:var(--text-dim); font-size:12px; padding: 4px 16px 0; }
</style>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);

const FOCUS_COLORS = {
  "Push + Power": "var(--push)",
  "Legs + Engine": "var(--legs)",
  "Pull + Posterior Chain": "var(--pull)",
  "Athletic Full Body": "var(--athletic)"
};
function focusColor(focus){ return FOCUS_COLORS[focus] || "var(--default-focus)"; }

// in-memory only: checkbox state resets each time you open the app / reload
const checkedState = {}; // workoutId -> Set of "sectionIdx-exIdx"

let view = "focus";      // "focus" | "list" | "detail"
let currentFocus = null;
let currentWorkoutId = null;

const main = document.getElementById('main');
const backBtn = document.getElementById('backBtn');
const topTitle = document.getElementById('topTitle');
const topEyebrow = document.getElementById('topEyebrow');

backBtn.addEventListener('click', () => {
  if (view === 'detail') { goToList(currentFocus); }
  else if (view === 'list') { goToFocus(); }
});

function goToFocus(){
  view = 'focus'; currentFocus = null; currentWorkoutId = null;
  backBtn.classList.add('hidden');
  topEyebrow.classList.add('hidden');
  topTitle.textContent = 'Hybrid Performance';
  render();
}
function goToList(focus){
  view = 'list'; currentFocus = focus; currentWorkoutId = null;
  backBtn.classList.remove('hidden');
  topEyebrow.classList.add('hidden');
  topTitle.textContent = focus;
  render();
}
function goToDetail(workout){
  view = 'detail'; currentWorkoutId = workout.id;
  backBtn.classList.remove('hidden');
  topEyebrow.classList.remove('hidden');
  topEyebrow.textContent = workout.focus;
  topTitle.textContent = workout.label;
  render();
}

function render(){
  if (view === 'focus') return renderFocus();
  if (view === 'list') return renderList();
  if (view === 'detail') return renderDetail();
}

function renderFocus(){
  const counts = {};
  DATA.workouts.forEach(w => { counts[w.focus] = (counts[w.focus] || 0) + 1; });

  let html = `
    <div class="app-title">
      <h1>Choose your focus</h1>
      <p>${DATA.workouts.length} workouts loaded</p>
    </div>
    <div class="focus-grid">`;

  DATA.focuses.forEach(f => {
    html += `
      <button class="focus-card" style="--focus-color:${focusColor(f)}" data-focus="${escapeAttr(f)}">
        <div>
          <div class="fc-name">${escapeHtml(f)}</div>
          <div class="fc-count">${counts[f] || 0} workout${(counts[f]||0)===1?'':'s'}</div>
        </div>
        <div class="fc-arrow">›</div>
      </button>`;
  });
  html += `</div>`;
  main.innerHTML = html;

  main.querySelectorAll('.focus-card').forEach(btn => {
    btn.addEventListener('click', () => goToList(btn.dataset.focus));
  });
}

function renderList(){
  const list = DATA.workouts.filter(w => w.focus === currentFocus);
  let html = `<div class="workout-list">`;
  list.forEach(w => {
    const secCount = w.sections.length;
    const exCount = w.sections.reduce((n, s) => n + s.exercises.length, 0);
    html += `
      <button class="workout-card" style="--focus-color:${focusColor(w.focus)}" data-id="${escapeAttr(w.id)}">
        <div class="wc-label">${escapeHtml(w.label)}</div>
        <div class="wc-meta">${secCount} section${secCount===1?'':'s'} · ${exCount} exercise${exCount===1?'':'s'} · Warm-up: ${escapeHtml(w.warmup || '—')}</div>
      </button>`;
  });
  html += `</div>`;
  main.innerHTML = html;

  main.querySelectorAll('.workout-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const w = DATA.workouts.find(x => x.id === btn.dataset.id);
      goToDetail(w);
    });
  });
}

function totalCheckable(workout){
  return workout.sections.reduce((n, s) => n + s.exercises.length, 0);
}
function checkedCount(workout){
  const set = checkedState[workout.id];
  return set ? set.size : 0;
}

function renderDetail(){
  const workout = DATA.workouts.find(w => w.id === currentWorkoutId);
  if (!checkedState[workout.id]) checkedState[workout.id] = new Set();

  const total = totalCheckable(workout);
  const done = checkedCount(workout);
  const pct = total ? Math.round((done/total)*100) : 0;

  let html = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${done}/${total} done</div>
    </div>`;

  if (workout.warmup){
    html += `
      <div class="block">
        <div class="block-header">
          <div class="block-title"><span class="warmup-icon">🔥</span> Warm-up</div>
        </div>
        <div class="block-simple-value">${escapeHtml(workout.warmup)}</div>
      </div>`;
  }

  workout.sections.forEach((sec, sIdx) => {
    html += `
      <div class="block">
        <div class="block-header">
          <div class="block-title">${escapeHtml(sec.name)}</div>
          <div class="block-scheme">${escapeHtml(sec.scheme || '')}</div>
        </div>`;
    sec.exercises.forEach((ex, eIdx) => {
      const key = sIdx + '-' + eIdx;
      const isChecked = checkedState[workout.id].has(key);
      html += `
        <div class="ex-row ${isChecked?'checked':''}" data-key="${key}">
          <div class="checkbox ${isChecked?'checked':''}">✓</div>
          <div class="ex-name">${escapeHtml(ex.exercise)}</div>
          ${ex.reps ? `<div class="ex-reps">${escapeHtml(ex.reps)}</div>` : ''}
        </div>`;
    });
    html += `</div>`;
  });

  if (workout.closerScheme || workout.closerModality){
    html += `
      <div class="block">
        <div class="block-header">
          <div class="block-title"><span class="closer-icon">⏱️</span> Closer / Conditioning</div>
        </div>
        <div class="block-simple-value">${escapeHtml(workout.closerScheme || '')}${workout.closerScheme && workout.closerModality ? ' — ' : ''}${escapeHtml(workout.closerModality || '')}</div>
      </div>`;
  }

  main.innerHTML = html;

  main.querySelectorAll('.ex-row').forEach(row => {
    row.addEventListener('click', () => {
      const key = row.dataset.key;
      const set = checkedState[workout.id];
      if (set.has(key)) set.delete(key); else set.add(key);
      renderDetail();
    });
  });
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

goToFocus();
</script>
